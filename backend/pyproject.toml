[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aroundyou-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2,<3", "PyJWT>=2.9,<3", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
modal = ["modal==1.6.3"]
modal-test = ["lm-format-enforcer==0.11.3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
